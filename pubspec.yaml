name: animal_project
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0   # 네 기준 유지

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- 기본 패키지 (네 기준 유지) ---
  fl_chart: ^1.1.1
  syncfusion_flutter_datepicker: ^31.2.2
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  http_parser: ^4.1.2   # 최신 버전으로 통합
  url_launcher: ^6.3.0
  intl: ^0.20.2
  image_picker: ^1.0.7
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2

  # --- 네이버 지도 + 공통 패키지 ---
  flutter_naver_map: ^1.4.0
  share_plus: ^7.2.1
  shared_preferences: ^2.2.3
  smooth_page_indicator: ^1.2.0+3

  # --- geolocator (세찬 최신 버전으로 선택) ---
  geolocator: ^14.0.2

  # --- 세찬이 추가한 패키지 (신규 포함) ---
  flutter_image_compress: ^2.3.0
  flutter_quill: ^11.5.0
  image: ^4.5.4
  path_provider: ^2.1.5
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/images/
