name: animal_project
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI/차트/위젯
  fl_chart: ^1.1.1
  syncfusion_flutter_datepicker: ^31.2.2
  cupertino_icons: ^1.0.8

  # 네트워킹/유틸
  http: ^1.2.2
  http_parser: ^4.0.2
  url_launcher: ^6.3.0
  intl: ^0.20.2
  image_picker: ^1.0.7

  # 로컬 알림/타임존
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/images/   # lib 아래 images 폴더 사용
